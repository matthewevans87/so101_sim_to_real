seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
#
# NOTE: 'network:' applies when vision_encoder.type == 'resnet18' (used by skrl's Runner).
#       'cnn:', 'head_dims:', and 'value.hidden_dims:' apply when type == 'trainable_cnn'
#       (used by _build_cnn_runner in train.py; ignored by Runner).
models:
  separate: True  # Use separate networks for actor and critic
  policy:  # Actor: vision-based only
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    # resnet18 path: MLP operating on 1024-D ResNet features + joint positions
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
    # trainable_cnn path: CNN backbone architecture (ignored by resnet18 path)
    # Layer 1: k=5,s=2 (was k=8,s=4) — finer first-layer stride preserves more
    # spatial resolution; final SpatialSoftmax map is 14×25 vs prev 8×13,
    # giving ~7.7 px/cell instead of ~14 px/cell for better keypoint precision.
    cnn:
      channels: [32, 64, 128, 128]
      kernel_sizes: [5, 4, 3, 3]
      strides: [2, 2, 2, 1]
      mlp_hidden_dims: [256]  # SpatialSoftmax projection MLP hidden dims
      output_dim: 256         # CNN feature vector dimension
    head_dims: [256, 128, 64]  # Policy head: CNN features + joints → action means
  value:  # Critic: privileged state information
    class: DeterministicMixin
    clip_actions: False
    # resnet18 path: MLP operating on full observations
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ONE
    hidden_dims: [256, 128, 64]  # Value MLP dims (trainable_cnn path; ignored by resnet18 path)


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  cnn_learning_rate: 1.0e-05  # CNN encoder only (conv trunk + SpatialSoftmax + projection MLP)
  learning_rate: 1.0e-04  # Lower LR for vision
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  # How often (in PPO update steps) to write keypoint and activation-heatmap
  # overlay images to TensorBoard (trainable_cnn path only).
  viz_interval: 1
  # logging and checkpoint
  experiment:
    directory: "so101_rl"
    experiment_name: "so101_lift_cube"
    write_interval: auto
    checkpoint_interval: 25000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 1000000  # Longer training for vision
  environment_info: log