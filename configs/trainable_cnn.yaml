decimation: 2
episode_length_s: 10.0
sim:
  dt: 0.008333333333333333
scene:
  num_envs: 8
  env_spacing: 2.0
  replicate_physics: true

joints:
  all: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  active: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  wrist_roll_name: "wrist_roll"
  starting_position: [null, null, -25.0, 65.0, -90.0, null]
  starting_position_noise:
    enabled: true
    range: [-0.05, 0.05]

control:
  action_scale: 1.0

safety:
  max_joint_velocity: 2.0
  min_ee_height: 0.01

gripper:
  ee_link_name: "gripper"
  grip_zone_rot: [1.0, 0.0, 0.0, 0.0]
  tip_offset: [0.015, 0.0, -0.1]
  grip_zone_offset: [0.01, 0.0, -0.09]
  open_target: 0.8
  closed_target: 0.15

distractors:
  count: 10
  geometry:
    cube_size: [0.03, 0.03, 0.03]
    sphere_radius: 0.02
    cone_radius: 0.02
    cone_height: 0.04
  randomization:
    enabled: true
    size_randomization_enabled: true
    active_probability: 0.8
    size_range: [1.0, 5.0]
  position:
    x_range: [0.5, 0.8]
    y_range: [-1.0, 1.0]
    z_range: [0.01, 0.25]

debug:
  save_images:
    pre_processing:
      save: false
      interval: 10
    post_processing:
      save: true
      interval: 10
  enable_gripper_arrow_markers: false
  enable_tip_markers: false
  enable_camera_frame_markers: false

behavior:
  binary_gripper_action:
    enabled: false

rewards:
# baseline reward components

# distance from gripper to cube (meters)
  distance:
    enabled: true
    scale: -5.0
# binary reward for touching a properly positioned cube with the gripper
  grip_cube:
    enabled: true
    scale: 2.0
    distance_threshold: 0.02
# fraction lifted (to threshold)
  lift_cube:
    enabled: true
    scale: 5.0
# sum of actions
  action:
    enabled: true
    scale: -0.001
# binary penalty for touching the table
  safety_touch_table:
    enabled: true
    scale: -1.0
# terminal reward for successfully lifting the cube above the height threshold (meters)
  success_lift_fraction_terminal:
    enabled: true
    scale: 100.0
    height_threshold: 0.10


  gripper_cube_alignment:
    enabled: false
    scale: 1.0
  camera_cube_alignment:
    enabled: false
    scale: 1.0
  close_gripper:
    enabled: false
    scale: 10.0
    close_target: 0.17453292519943295
    max_open: 1.7453292519943295
  gripper_force:
    enabled: false
    scale: 10.0
    force_target: 1.0
  gripper_look_at_cube:
    enabled: false
    scale: 1.0
  ee_linear_speed:
    enabled: false
    scale: -0.01
    safe_speed: 0.1
  joint_speed:
    enabled: false
    scale: -0.01
  ee_height_safety:
    enabled: false
    scale: -100.0
  success_touch_terminal:
    enabled: false
    scale: 500.0
    touch_force_threshold: 0.001
  success_point_at_cube_terminal:
    enabled: false
    scale: 2000.0
  safety_touch_table_terminal:
    enabled: false
    scale: -2000.0
  vantage:
    enabled: false
    ideal_distance: 0.15
    ideal_distance_sigma: 0.10
    ideal_height: 0.10
    ideal_height_sigma: 0.15
    min_distance_threshold: 0.08
    far_distance_threshold: 0.20
    scale: 1.0
  keep_camera_upright:
    enabled: false
    scale: -1.0

domain_randomization:
  camera:
    feed:
      preshape_image:
        enabled: false
      gaussian_noise:
        enabled: false
        std_range: [0.01, 0.02]
      brightness:
        enabled: false
        range: [0.85, 1.15]
      contrast:
        enabled: false
        range: [0.8, 1.2]
      gaussian_blur:
        enabled: false
        kernel_size: 7
        sigma: 2.0
      cheap_webcam_effect:
        enabled: false
      motion_blur:
        enabled: false
        kernel_size: 5
        strength_range: [0.1, 0.2]
      jpeg_compression:
        enabled: false
        quality_range: [60, 70]
    pose:
      enabled: false
      position_noise_range: [-0.001, 0.001]
      rotation_noise_deg_range: [-0.5, 0.5]
  world_lighting:
    enabled: false
    intensity_range: [500.0, 1500.0]
    color_variation: 0.05
  env_lighting:
    enabled: false
    height_range: [0.5, 2.0]
    intensity_range: [10000.0, 30000.0]
    color_variation: 0.05
    specular_range: [1.0, 5.0]
  cube:
    color_randomization_enabled: false
    size_randomization_enabled: false
    size_range: [0.975, 1.025]
    position_randomization:
      enabled: true
      radius_range: [0.35, 0.40]
      angle_range: [-15.0, 15.0]
      z_range: [0.03, 0.04]
  ground:
    enabled: false

sensors:
  camera:
    height: 108
    width: 192
  gripper_contact:
    debug_vis: false
  table_contact:
    track_pose: false
    debug_vis: false
  gripper_transform:
    debug_vis: false
  grip_zone_transform:
    debug_vis: false

observations:
  critic_obs_metrics:
    - cube_pos_gz
    - cube_rot6d_gz
    - cube_height_w
    - gripper_cube_contact_force_magnitude
    - is_table_touched

vision_encoder:
  # 'frozen_resnet18' — frozen pretrained ResNet18 + SpatialSoftmax (1024-D)
  # 'frozen_cnn'      — frozen pretrained CNN + SpatialSoftmax projection (output_dim-D)
  #                     Backbone weights loaded via --cnn_backbone_checkpoint.
  type: frozen_cnn
  # Image dimensions passed to the CNN. The env's ResizePipelineStep resizes to these.
  # 16:9 aspect ratio matching the physical Arducam 1080P (1920x1080) camera.
  # 108x192 is a 10x downscale; a no-op during sim training when the camera renders at this size.
  image_height: 108
  image_width: 192
  # CNN backbone architecture — must match the pretraining config exactly.
  backbone:
    channels: [32, 64, 128, 128]
    kernel_sizes: [5, 4, 3, 3]
    strides: [2, 2, 2, 1]
    mlp_hidden_dims: [256]
    output_dim: 256
