# ── sweep identity ─────────────────────────────────────────────────────────────
name: "ablation_shaping"

# ── base settings (shared by all experiments) ──────────────────────────────────
base:
  task: So101-LiftCube-v0

  # Base env config; per-experiment env_overrides are merged on top of this
  env_config: configs/policy_train.yaml

  # Base agent config; per-experiment agent_overrides are merged on top
  agent_config: so101_rl/source/so101_rl/so101_rl/tasks/direct/so101_lift_cube/agents/skrl_ppo_cfg.yaml

  # Five training seeds per condition for noise-floor estimation; sweep.py
  # replicates each experiment once per seed.
  seeds: [42, 43, 44, 45, 46]

  # Parallel environments during training
  envs: 256

  headless: true
  cameras: true
  # GEN 2 CNN
  cnn_checkpoint: /mnt/nas_1/matthew-evans/so101_sim_to_real/pipelines/pipeline_20260419_131039/04_train_cnn/checkpoints/best_model.pt

  # Sweep-wide agent overrides — bump PPO training length so policies plateau.
  agent_overrides:
    trainer:
      timesteps: 50000

# ── eval settings ──────────────────────────────────────────────────────────────
eval:
  episodes: 1024
  num_envs: 64
  num_videos: 5
  record_videos:
    wrist_cam: false
    overhead_cam: false
    viewport_cam: false
  headless: true
  verbosity: basic

experiment_definition:

#Shaping Ablation
  - config_set: 
      - config: 
          env_overrides:
            rewards:
              - type: wrist_roll_pose
                enabled: false  
      - config: 
          env_overrides:
            rewards:
              - type: avoid_bumping_cube
                enabled: false
      - config: 
          env_overrides:
            rewards:
              - type: time_penalty
                enabled: false
