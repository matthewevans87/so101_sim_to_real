# ── sweep identity ─────────────────────────────────────────────────────────────
name: "ablation_reward_contribution_followup"

# ── Design ─────────────────────────────────────────────────────────────────────
#
# Follow-up to ablation_reward_contribution.yaml, which showed that
# approach_phase_terminal alone achieves 69% success at 15 k steps while every
# other single-reward addition is near zero.
#
# Hypothesis: grasp_phase_terminal compounding on top of approach_phase_terminal
# should further improve success because once approach is reliably learned the
# grasp gate (approach_phase >= 0.5 AND grip_zone_cube_distance <= 0.04) fires
# frequently enough for grasp_phase_terminal to contribute.
#
# Experiment legend:
#   exp_001  approach_phase_terminal only          (control — replicates exp_006)
#   exp_002  approach_phase_terminal + grasp_phase_terminal
#   exp_003  approach_phase_terminal + grasp_phase[absolute]
#   exp_004  approach_phase_terminal + grasp_phase[absolute] + grasp_phase_terminal
#   exp_005  ALL approach + grasp phase rewards on (full baseline subset, no lift shaping)
#
# The always-on set (same as the parent sweep):
#   lift_phase[progressive/absolute] (gates removed)
#   static[success_terminal]
#   action regulariser
#   cube_out_of_range_terminal / safety_touch_table_terminal
# ───────────────────────────────────────────────────────────────────────────────

base:
  task: So101-LiftCube-v0
  env_config: configs/policy_train.yaml
  agent_config: so101_rl/source/so101_rl/so101_rl/tasks/direct/so101_lift_cube/agents/skrl_ppo_cfg.yaml

  seeds: [42]

  envs: 256
  headless: true
  cameras: true

  cnn_checkpoint: /mnt/nas_1/matthew-evans/so101_sim_to_real/pipelines/pipeline_20260419_131039/04_train_cnn/checkpoints/best_model.pt

  agent_overrides:
    trainer:
      timesteps: 15000

  # Sweep-wide: disable all optional rewards; remove lift_phase gates.
  env_overrides:
    rewards:
      - type: approach_distance
        enabled: false
      - type: approach_alignment
        enabled: false
      - type: approach_phase
        id: progressive
        enabled: false
      - type: approach_phase
        id: absolute
        enabled: false
      - type: approach_phase_terminal
        enabled: false
      - type: grasp_phase
        id: progressive
        enabled: false
      - type: grasp_phase
        id: absolute
        enabled: false
      - type: grasp_phase_terminal
        enabled: false
      - type: lift_phase
        id: progressive
        gates: []
      - type: lift_phase
        id: absolute
        gates: []
      - type: wrist_roll_pose
        enabled: false
      - type: avoid_bumping_cube
        enabled: false
      - type: safety_touch_table
        enabled: false
      - type: time_penalty
        enabled: false


eval:
  episodes: 1024
  num_envs: 64
  num_videos: 5
  record_videos:
    wrist_cam: false
    overhead_cam: false
    viewport_cam: false
  headless: true
  verbosity: basic


experiment_definition:

  - config_set:

      # exp_001 — approach_phase_terminal only (control)
      - config:
          env_overrides:
            rewards:
              - type: approach_phase_terminal
                enabled: true

      # exp_002 — approach_phase_terminal + grasp_phase_terminal
      - config:
          env_overrides:
            rewards:
              - type: approach_phase_terminal
                enabled: true
              - type: grasp_phase_terminal
                enabled: true

      # exp_003 — approach_phase_terminal + grasp_phase[absolute]
      - config:
          env_overrides:
            rewards:
              - type: approach_phase_terminal
                enabled: true
              - type: grasp_phase
                id: absolute
                enabled: true

      # exp_004 — approach_phase_terminal + grasp_phase[absolute] + grasp_phase_terminal
      - config:
          env_overrides:
            rewards:
              - type: approach_phase_terminal
                enabled: true
              - type: grasp_phase
                id: absolute
                enabled: true
              - type: grasp_phase_terminal
                enabled: true

      # exp_005 — all approach + grasp phase rewards on (dense + terminal)
      - config:
          env_overrides:
            rewards:
              - type: approach_distance
                enabled: true
              - type: approach_alignment
                enabled: true
              - type: approach_phase
                id: progressive
                enabled: true
              - type: approach_phase
                id: absolute
                enabled: true
              - type: approach_phase_terminal
                enabled: true
              - type: grasp_phase
                id: progressive
                enabled: true
              - type: grasp_phase
                id: absolute
                enabled: true
              - type: grasp_phase_terminal
                enabled: true
