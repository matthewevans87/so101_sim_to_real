decimation: 2
episode_length_s: 10.0
sim:
  dt: 0.008333333333333333
scene:
  num_envs: 256
  env_spacing: 2.0
  replicate_physics: true

joints:
  all: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  active: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  wrist_roll_name: "wrist_roll"
  starting_position: [null, null, -25.0, 65.0, -90.0, null]
  # Per-joint noise (rad), aligned 1:1 with joints.all.  Wide noise on yaw
  # (shoulder_pan), wrist_roll and gripper is harmless; lift-axis joints
  # (shoulder_lift / elbow_flex / wrist_flex) need tight noise to avoid
  # dipping arm links into the table at t=0.  fk_safety provides a hard
  # backstop via Isaac Lab kinematic FK rejection-sampling at reset.
  starting_position_noise:
    enabled: true
    ranges:
      - [-0.40, 0.40]   # shoulder_pan
      - [-0.05, 0.05]   # shoulder_lift
      - [-0.05, 0.05]   # elbow_flex
      - [-0.05, 0.05]   # wrist_flex
      - [-0.40, 0.40]   # wrist_roll
      - [-0.40, 0.40]   # gripper
    fk_safety:
      enabled: true
      min_link_z_above_table: 0.005   # m, 5 mm clearance to absorb FP noise
      tracked_links:
        - shoulder
        - upper_arm
        - lower_arm
        - wrist
        - gripper
        - moving_jaw_so101_v1
      max_resamples: 32

control:
  action_scale: 1.0

# Action-processing pipeline (must match so101_real/configs/robot.yaml values).
# Applies EMA smoothing + per-step delta clamping + joint-limit clamping to
# every policy action in sim, matching the real robot's controller._tick() pipeline.
joint_command:
  enabled: false
  ema_alpha: 0.90
  max_delta_rad: 0.13    # ~7.5° per step at 60 Hz; embedded in bundle
  ema_joints: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
  clamp_joints: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]

safety:
  max_joint_velocity: 2.0
  min_ee_height: 0.01

gripper:
  ee_link_name: "gripper"
  grip_zone_rot: [1.0, 0.0, 0.0, 0.0]
  tip_offset: [0.015, 0.0, -0.1]
  open_target: 0.8
  closed_target: 0.15

distractors:
  count: 10
  geometry:
    cube_size: [0.03, 0.03, 0.03]
    sphere_radius: 0.02
    cone_radius: 0.02
    cone_height: 0.04
  randomization:
    enabled: true
    size_randomization_enabled: true
    active_probability: 0.8
    size_range: [1.0, 5.0]
  position:
    x_range: [0.5, 0.8]
    y_range: [-1.0, 1.0]
    z_range: [0.01, 0.25]

debug:
  save_images:
    pre_processing:
      save: false
      interval: 10
    post_processing:
      save: false
      interval: 10
  enable_gripper_arrow_markers: false
  enable_camera_frame_markers: false
  enable_grip_zone_markers: false
  enable_goal_zone_markers: false
  vision_debug:
    enabled: false
    interval: 100
    num_envs_logged: 1
    raw_image:
      enabled: true
    pipelined_image:
      enabled: true
    conv_layer_maps:
      enabled: true
      max_channels: 16
    activation_heatmap:
      enabled: true
    keypoints:
      enabled: true

behavior:
  binary_gripper_action:
    enabled: false
  max_cube_distance: 0.40

metrics:
  approach_distance:
    pressure: 20.0
    linear_weight: 5.0
  approach_alignment:
    pressure: 1.0
    linear_weight: 5.0
  approach_gripper_pose:
    gripper_pos_target: 0.8753292519943295
    pressure: 1.0
    linear_weight: 5.0
  approach_phase:
    distance_pressure: 20.0
    alignment_pressure: 1.0
    gripper_pos_pressure: 0.0  # disabled: gripper state is for grasp phase, not approach
    gripper_pos_target: 0.8753292519943295
  grasp_phase:
    grip_force_sat_threshold: 10.0  # bilateral pinch force (N) at which grasp_phase saturates to 1.0
  grip_cube:
    distance_threshold: 0.04  # grip-zone-to-cube distance (m) for is_cube_in_grip_position
    touch_force_threshold: 0.001  # minimum contact force (N) for is_cube_gripped
  cube_out_of_range:
    distance_threshold: 0.40  # cube-to-base distance (m) beyond which episode may terminate
  lift_phase:
    height_threshold: 0.20  # cube height (m) at which cube_lift_fraction reaches 1.0
  approach_phase_terminal:
    threshold: 0.80  # approach_phase value above which approach_phase_terminal is True
  grasp_phase_terminal:
    threshold: 0.80  # grasp_phase value above which grasp_phase_terminal is True
  goal_zone_distance:
    pressure: 0.3   # exp(-pressure * dist / cube_width); higher = sharper peak at goal
    distance_threshold: 0.05  # metres — cube centroid within this distance is considered reached

episode_stats:
  lift_height_threshold: 0.02  # cube height above resting position (m) at which cube is considered 'lifted'
                               # for lift_rate, drop_rate, and time_to_lift statistics.
                               # Must be above physics jitter (~0.001–0.002 m); 0.02 m (2 cm) is a safe margin.
                               # Intentionally smaller than metrics.lift_phase.height_threshold (0.20).

rewards:
  # mode: absolute (default)     — reward the current metric value each step.
  # mode: unsigned_progressive    — reward only the improvement delta vs the previous step
  #                                 (clamped to min=0; regressions yield zero).
  # mode: signed_progressive      — reward the signed delta; regressions yield negative reward.


  # APPROACH
  - type: approach_distance
    enabled: true
    scale: 20.0
    mode: unsigned_progressive

  - type: approach_alignment
    enabled: true
    scale: 1.0
    mode: unsigned_progressive

  - type: approach_gripper_pose
    enabled: false
    scale: 1.0

  - type: approach_phase
    id: progressive
    enabled: true
    scale: 5.0
    mode: unsigned_progressive

# disabling per the ablation study findings
  - type: approach_phase
    id: absolute
    enabled: false
    scale: 1.0
    mode: absolute

  - type: approach_phase_terminal
    enabled: true
    scale: 500.0
    fire_once: true

  # - type: close_gripper
  #   enabled: true
  #   scale: 10.0
  #   close_target: 0.15   # gripper joint radian position when fully closed
  #   max_open: 0.65       # open (0.80) - closed (0.15) = 0.65 rad

  # GRASP
  - type: grasp_phase
    id: progressive
    enabled: true
    scale: 10.0
    mode: unsigned_progressive
    gates:
      - metric: approach_phase
        gte: 0.50
      - metric: grip_zone_cube_distance
        lte: 0.04

  - type: grasp_phase
    id: absolute
    enabled: true
    scale: 5.0
    mode: absolute
    gates:
      - metric: approach_phase
        gte: 0.50
      - metric: grip_zone_cube_distance
        lte: 0.04

  - type: grasp_phase_terminal
    enabled: true
    scale: 500.0
    fire_once: true
        
  # LIFT
  - type: lift_phase
    id: progressive
    enabled: true
    scale: 1000.0
    mode: signed_progressive
    gates:
      - metric: approach_phase
        gte: 0.8
      - metric: grasp_phase
        gte: 0.7

  - type: lift_phase
    id: absolute
    enabled: true
    scale: 5.0
    mode: absolute
    gates:
      - metric: approach_phase
        gte: 0.8
      - metric: grasp_phase
        gte: 0.7

  - type: static
    id: success_terminal
    enabled: true
    scale: 1000.0
    fire_once: true
    gates:
      - metric: cube_lift_fraction
        gte: 1.0

  # SHAPING
  - type: wrist_roll_pose
    enabled: true
    scale: 1.0
    target_rad: -1.5707963267948966  # Keep wrist roll at -90° (ideal for top-down and side grasps)
    pressure: 1.0
    mode: signed_progressive
    
  - type: avoid_bumping_cube
    enabled: true
    scale: -0.1
    cube_widths: 1.0 # Anything less than 0.5 is impossible

  - type: action
    enabled: true
    scale: -0.02
    joints: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
    gates:
      - metric: grasp_phase
        lt: 0.7
  # - type: action
  #   enabled: true
  #   scale: -0.02
  #   joints: ["shoulder_pan", "gripper"]
  #   gates:
  #     - metric: grasp_phase
  #       gte: 0.7

  # binary penalty for touching the table
  - type: safety_touch_table
    enabled: true
    scale: -1.0

  # Time-based penalty: at step i the per-step penalty is scale * i/N.
  # Total episode penalty ≈ scale * N/2 (triangular sum), not scale * N.
  # E.g. scale=-0.01, N≈600 steps → total ≈ -3 per episode (mild shaping).
  # Tune scale so the total is small relative to sparse terminal rewards (±500).
  - type: time_penalty
    enabled: true
    scale: -1.0

  # terminal when cube is pushed out of reach of the robot base
  - type: cube_out_of_range_terminal
    enabled: true
    scale: 0.0

  - type: safety_touch_table_terminal
    enabled: true
    scale: 0.0


# ===========================================================================
# Termination conditions
# ---------------------------------------------------------------------------
# Each entry produces a TerminationCondition that ends the episode when its
# gates evaluate True for an env on a step.  Termination is fully decoupled
# from rewards: reward shaping that should accompany an end-of-episode event
# is configured separately above (typically with `fire_once: true` and the
# same gates).  Exactly one enabled entry must declare `is_success: true` so
# the eval pipeline can classify the primary termination cause without
# string-matching reward names.
# ===========================================================================
terminations:
  - id: success_lift_fraction_terminal
    enabled: true
    is_success: true
    gates:
      - metric: cube_lift_fraction
        gte: 1.0

  - id: cube_out_of_range_terminal
    enabled: true
    is_success: false
    gates:
      - metric: is_cube_out_of_range
        gte: 0.5

  - id: safety_touch_table_terminal
    enabled: true
    is_success: false
    gates:
      - metric: is_table_touched
        gte: 0.5


domain_randomization:
  camera:
    feed:
      gaussian_noise:
        enabled: true
        std_range: [0.005, 0.015]
      brightness:
        enabled: true
        range: [0.85, 1.15]
      contrast:
        enabled: true
        range: [0.85, 1.15]
      gaussian_blur:
        enabled: false
        kernel_size: 7
        sigma: 2.0
      cheap_webcam_effect:
        enabled: true
      motion_blur:
        enabled: true
        kernel_size: 5
        strength_range: [0.05, 0.15]
      jpeg_compression:
        enabled: true
        quality_range: [60, 90]
    pose:
      enabled: false
      position_noise_range: [-0.001, 0.001]
      rotation_noise_deg_range: [-0.5, 0.5]
  world_lighting:
    enabled: true
    intensity_range: [500.0, 1500.0]
    color_variation: 0.05
  env_lighting:
    enabled: true
    height_range: [0.5, 2.0]
    intensity_range: [10000.0, 30000.0]
    color_variation: 0.05
    specular_range: [1.0, 5.0]
  cube:
    color_randomization_enabled: false
    size_randomization_enabled: false
    size_range: [0.975, 1.025]
    position_randomization:
      enabled: true
      # NOTE: cube_out_of_range fires when
      #   ||cube_pos_w - robot.root_pos_w|| > metrics.cube_out_of_range.
      #   distance_threshold (= 0.40 m).
      # The cube is sampled at env_origin + (r·cosθ, r·sinθ, z); the robot
      # root is at env_origin + (0, 0, robot_root_z_offset_m), so the worst
      # vertical separation is max(|z - offset|) = 0.04 - (-0.03) = 0.07 m.
      # Worst distance = √(0.39² + 0.07²) = 0.3962 m, leaving ~3.8 mm of
      # margin.  Enforced by
      # So101EnvParams._validate_cross_field_invariants.
      radius_range: [0.35, 0.39]
      angle_range: [-15.0, 15.0]
      z_range: [0.03, 0.04]
      # Must match SO101_CFG.init_state.pos[2] in
      # so101_rl.configurations.so101.  Negative because the robot root is
      # spawned 3 cm below the env origin.
      robot_root_z_offset_m: -0.03
  ground:
    enabled: false
  goal_zone:
    enabled: true
    radius_range: [0.25, 0.35]  # m from robot base
    angle_range: [-30.0, 30.0]  # degrees
    z_range: [0.15, 0.20]       # m above table

sensors:
  camera:
    height: 108
    width: 192
    model: opencv_pinhole
    intrinsics_path: so101_real/configs/camera_intrinsics.yaml
  gripper_contact:
    debug_vis: false
  moving_jaw_contact:
    debug_vis: false
  table_contact:
    track_pose: false
    debug_vis: false
  gripper_transform:
    debug_vis: false

observations:
  # NOTE: As of skrl 1.4.3, the installed IsaacLabWrapper.step() reads only
  # observations["policy"] and discards observations["critic"] (verified in
  # ~/.conda/envs/env_isaaclab/lib/python3.11/site-packages/skrl/envs/wrappers/torch/isaaclab_envs.py).
  # The PPO value network is therefore trained on the actor's obs vector
  # regardless of `models.separate`. Until skrl is upgraded to a wrapper that
  # routes the critic dict, the critic-specific entries below are commented
  # out — populating them would just add dead compute. The empirical
  # demonstration is in: configs/sweeps/ablation_shared_critic.yaml.
  #
  # critic_include_vision_features: true
  # critic_obs_metrics:
  #   - cube_pos_gz
  #   - cube_rot6d_gz
  #   - cube_height_w
  #   - gripper_cube_contact_force_magnitude
  #   - fixed_jaw_cube_contact_force_magnitude
  #   - is_table_touched
  #   - normalized_grip_zone_cube_distance
  #   - cube_linear_velocity
  #   - cube_angular_velocity
  #   - gripper_open_width
  actor_obs_metrics: []
  telemetry_metrics:
    - gripper_cube_alignment
    - cube_rot6d_gz

vision_encoder:
  # 'frozen_resnet18' — frozen pretrained ResNet18 + SpatialSoftmax (1024-D)
  # 'frozen_cnn'      — frozen pretrained CNN + SpatialSoftmax (2×channels[-1]-D = 1024-D)
  #                     Model weights loaded via --cnn_checkpoint.
  type: frozen_cnn
  # Image dimensions passed to the CNN. The env's ResizePipelineStep resizes to these.
  # 16:9 aspect ratio matching the physical Arducam 1080P (1920x1080) camera.
  # 108x192 is a 10x downscale; a no-op during sim training when the camera renders at this size.
  image_height: 108
  image_width: 192
  # CNN backbone architecture — must match the pretraining config exactly.
  backbone:
    channels: [64, 128, 256, 512]
    kernel_sizes: [5, 4, 3, 3]
    strides: [2, 2, 2, 1]
    mlp_hidden_dims: [512]
    output_dim: 256
