# Env config for the 2-generation CNN bootstrap pipeline.
#
# Reward configuration: confirmed-optimal minimal set from the
# ablation_reward_contribution + confirm_optimal_reward_config sweeps
# (2026-04-24 / 2026-05-01 campaigns). Achieves 86.8% success at 50k steps,
# matching the full-reward baseline while training faster and more stably.
#
# Enabled rewards:   approach_phase_terminal (500), grasp_phase[absolute] (5),
#                    lift_phase[progressive/absolute] (gates removed),
#                    static[success_terminal] (1000), action regulariser,
#                    cube_out_of_range_terminal, safety_touch_table_terminal.
# Disabled rewards:  all other approach/grasp dense shaping, wrist_roll_pose,
#                    avoid_bumping_cube, safety_touch_table, time_penalty.
#
# Vision encoder: frozen_resnet18 (Gen1 bootstrap).

decimation: 2
episode_length_s: 10.0
sim:
  dt: 0.008333333333333333
scene:
  num_envs: 256
  env_spacing: 2.0
  replicate_physics: true

joints:
  all: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  active: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
  wrist_roll_name: "wrist_roll"
  starting_position: [null, null, -25.0, 65.0, -90.0, null]
  starting_position_noise:
    enabled: true
    ranges:
      - [-0.40, 0.40]   # shoulder_pan
      - [-0.05, 0.05]   # shoulder_lift
      - [-0.05, 0.05]   # elbow_flex
      - [-0.05, 0.05]   # wrist_flex
      - [-0.40, 0.40]   # wrist_roll
      - [-0.40, 0.40]   # gripper
    fk_safety:
      enabled: true
      min_link_z_above_table: 0.005
      tracked_links:
        - shoulder
        - upper_arm
        - lower_arm
        - wrist
        - gripper
        - moving_jaw_so101_v1
      max_resamples: 32

control:
  action_scale: 1.0

safety:
  max_joint_velocity: 2.0
  min_ee_height: 0.01

gripper:
  ee_link_name: "gripper"
  grip_zone_rot: [1.0, 0.0, 0.0, 0.0]
  tip_offset: [0.015, 0.0, -0.1]
  open_target: 0.8
  closed_target: 0.15

distractors:
  count: 10
  geometry:
    cube_size: [0.03, 0.03, 0.03]
    sphere_radius: 0.02
    cone_radius: 0.02
    cone_height: 0.04
  randomization:
    enabled: true
    size_randomization_enabled: true
    active_probability: 0.8
    size_range: [1.0, 5.0]
  position:
    x_range: [0.5, 0.8]
    y_range: [-1.0, 1.0]
    z_range: [0.01, 0.25]

debug:
  save_images:
    pre_processing:
      save: true
      interval: 10
    post_processing:
      save: true
      interval: 10
  enable_gripper_arrow_markers: false
  enable_camera_frame_markers: false
  enable_grip_zone_markers: false
  enable_goal_zone_markers: false
  vision_debug:
    enabled: false
    interval: 100
    num_envs_logged: 1
    raw_image:
      enabled: true
    pipelined_image:
      enabled: true
    conv_layer_maps:
      enabled: true
      max_channels: 16
    activation_heatmap:
      enabled: true
    keypoints:
      enabled: true

behavior:
  binary_gripper_action:
    enabled: false
  max_cube_distance: 0.40

metrics:
  approach_distance:
    pressure: 20.0
    linear_weight: 5.0
  approach_alignment:
    pressure: 1.0
    linear_weight: 5.0
  approach_gripper_pose:
    gripper_pos_target: 0.8753292519943295
    pressure: 1.0
    linear_weight: 5.0
  approach_phase:
    distance_pressure: 20.0
    alignment_pressure: 1.0
    gripper_pos_pressure: 0.0
    gripper_pos_target: 0.8753292519943295
  grasp_phase:
    grip_force_sat_threshold: 10.0
  grip_cube:
    distance_threshold: 0.02
    touch_force_threshold: 0.001
  cube_out_of_range:
    distance_threshold: 0.40
  lift_phase:
    height_threshold: 0.20
  approach_phase_terminal:
    threshold: 0.80
  grasp_phase_terminal:
    threshold: 0.80
  goal_zone_distance:
    pressure: 0.3
    distance_threshold: 0.05

episode_stats:
  lift_height_threshold: 0.02

rewards:
  # APPROACH — only terminal kept; all dense approach rewards disabled.
  - type: approach_distance
    enabled: false
    scale: 20.0
    mode: unsigned_progressive

  - type: approach_alignment
    enabled: false
    scale: 1.0
    mode: unsigned_progressive

  - type: approach_gripper_pose
    enabled: false
    scale: 1.0

  - type: approach_phase
    id: progressive
    enabled: false
    scale: 5.0
    mode: unsigned_progressive

  - type: approach_phase
    id: absolute
    enabled: false
    scale: 1.0
    mode: absolute

  - type: approach_phase_terminal
    enabled: true
    scale: 500.0
    fire_once: true

  # GRASP — only dense absolute kept; progressive and terminal disabled.
  - type: grasp_phase
    id: progressive
    enabled: false
    scale: 10.0
    mode: unsigned_progressive
    gates:
      - metric: approach_phase
        gte: 0.50
      - metric: grip_zone_cube_distance
        lte: 0.04

  - type: grasp_phase
    id: absolute
    enabled: true
    scale: 5.0
    mode: absolute
    gates:
      - metric: approach_phase
        gte: 0.50
      - metric: grip_zone_cube_distance
        lte: 0.04

  - type: grasp_phase_terminal
    enabled: false
    scale: 500.0
    fire_once: true

  # LIFT — gates removed because approach/grasp phase rewards are disabled.
  - type: lift_phase
    id: progressive
    enabled: true
    scale: 1000.0
    mode: signed_progressive
    gates: []

  - type: lift_phase
    id: absolute
    enabled: true
    scale: 5.0
    mode: absolute
    gates: []

  - type: static
    id: success_terminal
    enabled: true
    scale: 1000.0
    fire_once: true
    gates:
      - metric: cube_lift_fraction
        gte: 1.0

  # SHAPING — all disabled.
  - type: wrist_roll_pose
    enabled: false
    scale: 1.0
    target_rad: -1.5707963267948966
    pressure: 1.0
    mode: signed_progressive

  - type: avoid_bumping_cube
    enabled: false
    scale: -0.1
    cube_widths: 1.0

  - type: action
    enabled: true
    scale: -0.02
    joints: ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]
    gates:
      - metric: grasp_phase
        lt: 0.7

  - type: safety_touch_table
    enabled: false
    scale: -1.0

  - type: time_penalty
    enabled: false
    scale: -1.0

  - type: cube_out_of_range_terminal
    enabled: true
    scale: 0.0

  - type: safety_touch_table_terminal
    enabled: true
    scale: 0.0


terminations:
  - id: success_lift_fraction_terminal
    enabled: true
    is_success: true
    gates:
      - metric: cube_lift_fraction
        gte: 1.0

  - id: cube_out_of_range_terminal
    enabled: true
    is_success: false
    gates:
      - metric: is_cube_out_of_range
        gte: 0.5

  - id: safety_touch_table_terminal
    enabled: true
    is_success: false
    gates:
      - metric: is_table_touched
        gte: 0.5


domain_randomization:
  camera:
    feed:
      gaussian_noise:
        enabled: false
        std_range: [0.01, 0.02]
      brightness:
        enabled: false
        range: [0.85, 1.15]
      contrast:
        enabled: false
        range: [0.8, 1.2]
      gaussian_blur:
        enabled: false
        kernel_size: 7
        sigma: 2.0
      cheap_webcam_effect:
        enabled: false
      motion_blur:
        enabled: false
        kernel_size: 5
        strength_range: [0.1, 0.2]
      jpeg_compression:
        enabled: false
        quality_range: [60, 70]
    pose:
      enabled: false
      position_noise_range: [-0.001, 0.001]
      rotation_noise_deg_range: [-0.5, 0.5]
  world_lighting:
    enabled: false
    intensity_range: [500.0, 1500.0]
    color_variation: 0.05
  env_lighting:
    enabled: false
    height_range: [0.5, 2.0]
    intensity_range: [10000.0, 30000.0]
    color_variation: 0.05
    specular_range: [1.0, 5.0]
  cube:
    color_randomization_enabled: false
    size_randomization_enabled: false
    size_range: [0.975, 1.025]
    position_randomization:
      enabled: true
      radius_range: [0.35, 0.39]
      angle_range: [-15.0, 15.0]
      z_range: [0.03, 0.04]
      robot_root_z_offset_m: -0.03
  ground:
    enabled: false
  goal_zone:
    enabled: true
    radius_range: [0.25, 0.35]
    angle_range: [-30.0, 30.0]
    z_range: [0.15, 0.20]

sensors:
  camera:
    height: 108
    width: 192
    model: opencv_pinhole
    intrinsics_path: so101_real/configs/camera_intrinsics.yaml
  gripper_contact:
    debug_vis: false
  moving_jaw_contact:
    debug_vis: false
  table_contact:
    track_pose: false
    debug_vis: false
  gripper_transform:
    debug_vis: false

observations:
  actor_obs_metrics: []
  telemetry_metrics:
    - gripper_cube_alignment
    - cube_pos_gz
    - cube_rot6d_gz
    - cube_height_w

vision_encoder:
  type: frozen_resnet18
  image_height: 108
  image_width: 192
  backbone:
    channels: [64, 128, 256, 512]
    kernel_sizes: [5, 4, 3, 3]
    strides: [2, 2, 2, 1]
    mlp_hidden_dims: [512]
    output_dim: 256
