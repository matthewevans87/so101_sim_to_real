# Gen1 pipeline — frozen ResNet18 backbone.
#
# Stage 1 of the 2-generation CNN bootstrap:
#   Train policy (frozen_resnet18) → collect → curate → train CNN → export.
#
# The CNN checkpoint produced here (04_train_cnn/checkpoints/best_model.pt)
# feeds into pipeline_gen2.yaml via --cnn-checkpoint.

# [required] RL task name registered with Isaac Lab
task: So101-LiftCube-v0

# [required] Environment config for the train step.
env_config: configs/optimal_policy_train.yaml

# [required] RNG seed — used by collect, curate, and train-cnn for reproducibility.
seed: 42

# Run Isaac Sim in headless mode (no GUI window). Recommended for server runs.
headless: true

# Enable Isaac cameras. Required for the collect step to capture RGB frames.
cameras: true

# Override num_envs from the env_config YAML.
# null means inherit the value from env_config (no override).
envs: null

# ── collect parameters ────────────────────────────────────────────────────────

collect:
  # Collect one telemetry sample every N environment steps per env.
  sample_interval: 8

  # Stop collection after N complete episodes across all envs.
  episodes: 10000

  # Number of samples to buffer before flushing an NPZ shard to disk.
  shard_size: 2048

  # More envs → faster collection.
  envs: 128

# ── CNN parameters (curate + train-cnn) ──────────────────────────────────────

cnn:
  # CNN pretrain config YAML.
  config: configs/cnn_pretrain.yaml

  # PyTorch device for the train-cnn step.
  device: cuda:0

  # Conda environment name to use for curate and train-cnn.
  conda_env: null

  # Explicit Python executable path for curate and train-cnn.
  python: null

# ── export parameters ─────────────────────────────────────────────────────────

export:
  torchscript: false
