[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so101"
version = "0.1.0"
description = "Shared library for SO-101 sim-to-real pipeline"
requires-python = ">=3.8"
dependencies = ["torch>=1.13.0"]

[tool.setuptools.packages.find]
include = ["so101*"]
