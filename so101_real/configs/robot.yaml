# Robot config for so101_real.
# All required fields must be set explicitly — null values raise an error at startup.

# ── Robot hardware ────────────────────────────────────────────────────────────
robot:
  port: /dev/ttyACM0                  # SO-101 follower serial port
  calibration_file: /home/matthew-evans/.cache/huggingface/lerobot/calibration/robots/so_follower/lerobot.json
  max_delta_rad: null                 # null = use bundle value

# ── Camera ────────────────────────────────────────────────────────────────────
camera:
  device_index: 0
  capture_width: 1920
  capture_height: 1080
  warmup_frames: 10
  buffer_flush_count: 0
  fourcc: MJPG                        # MJPG required for 1920×1080 @ 30 fps

# ── Joint limits ─────────────────────────────────────────────────────────────
# sim:  [lower, upper] rad — URDF canonical bounds (policy normalization frame).
# real: [lower, upper] rad — LeRobot motor positions at the physical hard stops,
#                            measured by `joint_calibrate.py --mode sweep`.
#                            Calibration transform derived at runtime:
#                              scale = (sim_hi−sim_lo)/(real_hi−real_lo)
#                              q_canonical = scale·q_lerobot + (sim_lo − scale·real_lo)
joint_limits:
  shoulder_pan:
    # Sweep 2026-05-26: lero=[-119.2967°, +119.3846°]  sim=[-110.0°, +110.0°]
    sim:  [-1.919860,  1.919860]
    real: [-2.082135,  2.082450]
  shoulder_lift:
    # Sweep 2026-05-26: lero=[-104.0440°, +103.2527°]  sim=[-100.0°, +100.0°]
    sim:  [-1.745330,  1.745330]
    real: [-1.815988,  1.802185]
  elbow_flex:
    # Sweep 2026-05-26: lero=[-97.1429°,  +96.8791°]   sim=[ -96.8°,  +96.8°]
    sim:  [-1.690000,  1.690000]
    real: [-1.695979,  1.690567]
  wrist_flex:
    # Sweep 2026-05-26: lero=[-101.2747°, +101.8901°]  sim=[ -95.0°,  +95.0°]
    sim:  [-1.658060,  1.658060]
    real: [-1.767503,  1.778239]
  wrist_roll:
    # Sweep 2026-05-26: lero=[-165.7582°, +167.1648°]  sim=[-157.2°, +162.8°]
    sim:  [-2.743850,  2.841210]
    real: [-2.893715,  2.918289]
  gripper:
    # Sweep 2026-05-26: lero=[+0.2692°,   +99.8654°]   sim=[ -10.0°, +100.0°]
    sim:  [-0.174533,  1.745330]
    real: [ 0.004701,  1.743025]

# ── Episode reset pose ────────────────────────────────────────────────────────
# unit: rad | deg | norm
reset_pose:
  enabled: true
  joints: [0.0, 0.0, -25.0, 65.0, -90.0, 0.0]
  unit: deg
  duration_s: 3.0

# ── Inference controller ──────────────────────────────────────────────────────
controller:
  ema_alpha: 0.5      # null = use bundle value; 1.0 = no smoothing
  device: cuda
  control_hz: 30.0
